<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F4F7FC" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Surge LAN Console</title>
    <script>
      // Apply persisted appearance before paint to avoid FOUC.
      (function () {
        try {
          var raw = localStorage.getItem("surge-lan-console.preferences");
          var appearance = raw ? (JSON.parse(raw).state || {}).appearance : undefined;
          var dark =
            appearance === "dark" ||
            (!appearance && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          root.classList.toggle("dark", dark);
          root.dataset.theme = dark ? "dark" : "light";
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
