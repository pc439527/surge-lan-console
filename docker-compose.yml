# Surge LAN Console — container deployment
#   docker compose up -d --build
#   → http://<host>:8080
services:
  surge-console:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: 0.5.0
        GIT_COMMIT: c79d074
        GIT_BRANCH: main
        BUILD_TIME: 2026-08-24T07:50:43+00:00
    image: surge-lan-console:0.5.0
    container_name: surge-console
    ports:
      - "8080:80"
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"