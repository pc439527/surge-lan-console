# Surge LAN Console — container deployment
#   docker compose up -d --build
#   → http://<host>:8080
services:
  surge-console:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: 0.2.0
        GIT_COMMIT: da3065f
        GIT_BRANCH: main
        BUILD_TIME: 2026-08-19T17:45:43.769Z
    image: surge-lan-console:0.2.0
    container_name: surge-console
    ports:
      - "8080:80"
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"