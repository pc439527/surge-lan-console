server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ── Compression ─────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # ── Security headers (server-level; locations must NOT use add_header) ──
    add_header X-Content-Type-Options    nosniff always;
    add_header X-Frame-Options           DENY always;
    add_header Referrer-Policy           no-referrer always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    # ── PWA service worker (never cache; no add_header here to keep security headers) ──
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-store, must-revalidate" always;
        # re-declare security headers for this location
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
    }

    # ── Hashed static assets (immutable) ────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        try_files $uri =404;
    }

    # ── PWA icons / manifest ────────────────────────────────────
    location ~* \.(svg|webmanifest|json)$ {
        expires 7d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        try_files $uri =404;
    }

    # ── SPA fallback (React Router) ─────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
    }
}
