# Surge LAN Console — nginx static host
# Security headers centralized in /etc/nginx/snippets/security-headers.conf
# (Fix 13). NOTE: nginx add_header does NOT inherit from server/http level
# when a location defines its own add_header — so every location includes the
# snippets explicitly to avoid header drift.
#
# v0.2.2: /v1/ reverse proxy (proxy mode) — an HTTPS-served console can reach a
# plain-HTTP Surge device through this location (no browser mixed-content
# block). Change the upstream address to your Surge device's host:port.

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ── Compression ─────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # ── PWA service worker (never cache) ────────────────────────
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        expires -1;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # ── Hashed static assets (immutable) ────────────────────────
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # ── Deployment version check (never cache) ────────────────
    location = /version.json {
        include /etc/nginx/snippets/security-headers.conf;
        expires -1;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # ── Surge API reverse proxy (proxy mode, v0.2.2) ─────────────
    # Browser → console (same origin, HTTPS-safe) → nginx → Surge device.
    # The app targets this console's /v1/ path when a connection has
    # "通过控制台反向代理访问" enabled. Per-request connections (HTTP/1.0 +
    # Connection: close) also avoid the device's keep-alive reset behaviour.
    location /v1/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://192.168.50.10:6171;
        proxy_http_version 1.0;
        proxy_set_header Connection close;
        proxy_set_header Host 192.168.50.10:6171;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        expires -1;
        add_header Cache-Control "no-store" always;
    }

    # ── PWA icons / manifest ────────────────────────────────────
    location ~* \.(svg|webmanifest|json)$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 7d;
        add_header Cache-Control "public" always;
        try_files $uri =404;
    }

    # ── SPA fallback (React Router) ─────────────────────────────
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-cache" always;
    }
}
