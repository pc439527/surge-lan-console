# Surge LAN Console — nginx static host
# Security headers centralized in /etc/nginx/snippets/security-headers.conf
# (Fix 13): every location inherits them via include, no per-location drift.

include /etc/nginx/snippets/security-headers.conf;

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ── Compression ─────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # ── PWA service worker (never cache) ────────────────────────
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # ── Hashed static assets (immutable) ────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # ── PWA icons / manifest ────────────────────────────────────
    location ~* \.(svg|webmanifest|json)$ {
        expires 7d;
        add_header Cache-Control "public" always;
        try_files $uri =404;
    }

    # ── SPA fallback (React Router) ─────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-cache" always;
    }
}
