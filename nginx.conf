# Surge LAN Console — nginx static host
# Security headers centralized in /etc/nginx/snippets/security-headers.conf
# (Fix 13). NOTE: nginx add_header does NOT inherit from server/http level
# when a location defines its own add_header — so every location includes the
# snippets explicitly to avoid header drift.
#
# v0.6.0 (P0-5): /v1/ reverse proxy (proxy mode) — the console can reach a
# plain-HTTP Surge device through this location (no browser mixed-content
# block). The upstream is NO LONGER hardcoded to one device: the client sends
# X-Surge-Target: <host:port> per request and the maps below route only
# allowlisted targets. Unknown targets get HTTP 403 — the console is never an
# open proxy (SSRF-safe by default).
#
# Local Core foundation: /api/ is forwarded to the dedicated surge-core
# container. Auth/session, SQLite persistence and future scheduler/notification
# APIs live behind this same-origin path.
#
# conf.d/*.conf is included INSIDE the nginx http block, so map directives
# are valid here.

# ── Multi-device upstream allowlist (P0-5) ─────────────────────────
# Add every Surge device in your LAN:  "host:port"  ->  "http://host:port".
map $http_x_surge_target $surge_upstream {
    default               "http://127.0.0.1:9";   # unreachable sink — rejected
    "192.168.50.10:6171"    "http://192.168.50.10:6171";   # Apple TV
    # "192.168.50.11:6171" "http://192.168.50.11:6171";  # MacBook Air
    # "192.168.50.20:6171" "http://192.168.50.20:6171";  # iPhone
}

# Mirrors the upstream map — the Host header sent to Surge must equal the
# allowlisted target (keep both maps in sync).
map $http_x_surge_target $surge_upstream_host {
    default               "127.0.0.1:9";
    "192.168.50.10:6171"    "192.168.50.10:6171";
}

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ── Compression ─────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # ── Local Core API ──────────────────────────────────────────
    # Same-origin only; surge-core is not published on a host port in Compose.
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://surge-core:8787;
        proxy_http_version 1.1;
        # Preserve the full Host (including port) — Origin checks in Core compare
        # new URL(origin).host against request.headers.host; $host drops the port,
        # which broke Tailscale HTTPS access (https://host:8080 Origin vs host).
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        expires -1;
        add_header Cache-Control "no-store" always;
    }

    # ── PWA service worker (never cache) ────────────────────────
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        expires -1;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # ── Hashed static assets (immutable) ────────────────────────
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # ── Deployment version check (never cache) ────────────────
    location = /version.json {
        include /etc/nginx/snippets/security-headers.conf;
        expires -1;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # ── Surge API reverse proxy (proxy mode, v0.6.0 / P0-5) ────────
    # Browser → console (same origin, HTTPS-safe) → nginx → Surge device.
    # The app targets this console's /v1/ path when a connection has
    # "通过控制台反向代理访问" enabled, and sends X-Surge-Target so nginx can
    # route to the right device. Unknown targets → 403 (deny by default).
    # Per-request connections (HTTP/1.0 + Connection: close) also avoid the
    # device's keep-alive reset behaviour.
    location /v1/ {
        include /etc/nginx/snippets/security-headers.conf;
        # P0-5: reject targets that are not on the allowlist above.
        if ($surge_upstream_host = "127.0.0.1:9") { return 403; }
        proxy_pass $surge_upstream;
        proxy_http_version 1.0;
        proxy_set_header Connection close;
        proxy_set_header Host $surge_upstream_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        expires -1;
        add_header Cache-Control "no-store" always;
    }

    # ── PWA icons / manifest ────────────────────────────────────
    location ~* \.(svg|webmanifest|json)$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 7d;
        add_header Cache-Control "public" always;
        try_files $uri =404;
    }

    # ── SPA fallback (React Router) ─────────────────────────────
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-cache" always;
    }
}
