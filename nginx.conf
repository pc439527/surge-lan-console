# Surge LAN Console — nginx static host
# Security headers centralized in /etc/nginx/snippets/security-headers.conf
# NOTE: nginx add_header does NOT inherit from server/http level when a location
# defines its own add_header, so every location includes the security snippet.
#
# Surge access is intentionally single-path:
# Browser → /api/surge/:connectionId/v1/* → surge-core → registered LAN Surge.
# The browser never sends the real X-Key and nginx no longer exposes a parallel
# /v1/ device proxy or X-Surge-Target routing path.

# The container is loopback-bound in Compose. Preserve HTTPS reported by the
# trusted local TLS terminator; otherwise fall back to nginx's own scheme.
map $http_x_forwarded_proto $upstream_forwarded_proto {
    default $scheme;
    https   https;
}

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ── Compression ─────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # ── Local Core API ──────────────────────────────────────────
    # Same-origin only; surge-core is not published on a host port in Compose.
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://surge-core:8787;
        proxy_http_version 1.1;
        # Preserve the full Host (including port) — Origin checks in Core compare
        # new URL(origin).host against request.headers.host; $host drops the port,
        # which broke Tailscale HTTPS access (https://host:8080 Origin vs host).
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        expires -1;
        add_header Cache-Control "no-store" always;
    }

    # ── PWA service worker (never cache) ────────────────────────
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        expires -1;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # ── Hashed static assets (immutable) ────────────────────────
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # ── Deployment version check (never cache) ──────────────────
    location = /version.json {
        include /etc/nginx/snippets/security-headers.conf;
        expires -1;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # ── PWA icons / manifest ────────────────────────────────────
    location ~* \.(svg|webmanifest|json)$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 7d;
        add_header Cache-Control "public" always;
        try_files $uri =404;
    }

    # ── SPA fallback (React Router) ─────────────────────────────
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-cache" always;
    }
}
