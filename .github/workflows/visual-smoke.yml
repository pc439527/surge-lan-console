name: Visual Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: visual-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build deterministic visual mode
        run: pnpm build:visual

      - name: Install Chromium
        run: pnpm dlx playwright@1.55.0 install --with-deps chromium

      - name: Capture viewport matrix
        run: |
          pnpm exec vite preview --host 127.0.0.1 --port 4173 > /tmp/surge-visual-preview.log 2>&1 &
          echo $! > /tmp/surge-visual-preview.pid
          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/surge-visual-preview.log
            exit 1
          fi
          bash scripts/visual-smoke.sh http://127.0.0.1:4173

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-smoke-${{ github.sha }}
          path: |
            artifacts/visual-smoke/*.png
            /tmp/surge-visual-preview.log
          if-no-files-found: warn
          retention-days: 14
