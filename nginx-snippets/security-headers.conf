# Shared security headers — included at the http/server scope so every
# location inherits them even when it sets its own add_header (Fix 13).
#
# CSP is tuned for this app: React SPA served same-origin, no external
# scripts/fonts; ECharts renders to canvas (no blob/img-src caveats needed);
# 'unsafe-inline' style is required by Vite/React inline style injection.

add_header X-Content-Type-Options    "nosniff"                                  always;
add_header X-Frame-Options           "DENY"                                     always;
add_header Referrer-Policy           "no-referrer"                              always;
add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

# NOTE: no upgrade-insecure-requests — the console talks to LAN Surge
# instances over plain HTTP; forcing https would break connect-src to them.
add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' http: https:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

# HSTS — safe to send on plain HTTP too (browsers only honor it over HTTPS),
# and this image may be served behind a TLS terminator.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
